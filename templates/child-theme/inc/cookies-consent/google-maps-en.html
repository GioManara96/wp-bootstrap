    .ns-no-cookies{

      text-transform: uppercase;
      padding: 0.5rem 1rem;

      border: 0.1rem solid #0273c5;
      border-radius: 0.5rem;
      transition: all 0.3s cubic-bezier(.215, .61, .355, 1);

    .ns-no-cookies .iubenda-cs-preferences-link:hover{

      color: #0273c5;
