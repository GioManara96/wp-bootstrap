# >>> wpb: wildcard >>>
# wpb standard: {{SITES_DIR}}/<folder> is served as <folder>.{{LOCAL_TLD}}
# Keep this block LAST: the per-site (legacy) blocks above must match first.

# Never serve project secrets/state, for every vhost (server-level context).
# Note: a project's own .htaccess <Files*> granting access can still override these denies.
<FilesMatch "^\.(env(\..+)?|bootstrap-state)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.git(/|$)">
    Require all denied
</DirectoryMatch>

LogFormat "%V %h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" wpb_vhost_combined

<VirtualHost *:80>
    ServerName wpb-wildcard.{{LOCAL_TLD}}
    ServerAlias *.{{LOCAL_TLD}}
    UseCanonicalName Off
    VirtualDocumentRoot "{{SITES_DIR}}/%-2"
    <Directory "{{SITES_DIR}}">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory "{{SITES_DIR}}/logs">
        Require all denied
    </Directory>
    ErrorLog "{{SITES_DIR}}/logs/wpb-wildcard-error.log"
    CustomLog "{{SITES_DIR}}/logs/wpb-wildcard-access.log" wpb_vhost_combined
</VirtualHost>
# <<< wpb: wildcard <<<
